services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: vmos-backend
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    container_name: vmos-web
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: vmos-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
